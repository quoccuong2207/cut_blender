<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KitCut KeyGen">
<title>KitCut KeyGen Mobile (Riêng Tư)</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    margin: 0; padding: 18px; min-height: 100vh;
    background: #11161d; color: #eef2f7;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 440px;
    background: #1b222c; border: 1px solid #2d3848; border-radius: 16px;
    padding: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  h1 { margin: 0 0 6px; font-size: 20px; color: #4fc3f7; }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 13px 14px; font-size: 16px;
    background: #0f141a; color: #fff; border: 1px solid #334155;
    border-radius: 10px; outline: none; margin-bottom: 14px;
  }
  input:focus, select:focus { border-color: #38bdf8; }
  .btn {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
    background: linear-gradient(135deg, #0284c7, #2563eb);
    color: #fff; border: none; border-radius: 12px; cursor: pointer;
  }
  .btn:active { transform: scale(0.98); }
  .out-box {
    margin-top: 16px; padding: 14px; background: #0f141a;
    border: 1px dashed #38bdf8; border-radius: 10px; display: none;
  }
  .key-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 15px; font-weight: 700; color: #4ade80;
    word-break: break-all; margin-bottom: 10px;
  }
  .btn-copy {
    width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
    background: #16a34a; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  .msg { margin-top: 10px; font-size: 13px; color: #fbbf24; min-height: 18px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔑 KitCut KeyGen Mobile</h1>
  <div class="sub">File riêng tư — Chỉ lưu trên điện thoại của bạn (chạy Offline 100%)</div>

  <label for="hwid">Mã Máy Khách Hàng (HWID)</label>
  <input id="hwid" type="text" placeholder="VD: KC-7A9F-2C14-8B01" autocomplete="off" autocapitalize="characters">

  <label for="plan">Thời Hạn Bản Quyền</label>
  <select id="plan">
    <option value="0" selected>Vĩnh viễn (Lifetime)</option>
    <option value="1">Dùng thử 1 ngày</option>
    <option value="3">Dùng thử 3 ngày</option>
    <option value="7">Dùng thử 7 ngày</option>
    <option value="30">Gói 30 ngày</option>
    <option value="365">Gói 1 năm (365 ngày)</option>
  </select>

  <button class="btn" onclick="onGen()">⚡ TẠO KEY &amp; COPY</button>

  <div id="outBox" class="out-box">
    <div id="keyOut" class="key-text"></div>
    <button class="btn-copy" onclick="copyKey()">📋 Copy Lại Key</button>
  </div>
  <div id="msg" class="msg"></div>
</div>

<script>
// Pure-JS SHA-256 & HMAC-SHA256 (works offline even under file:// or content:// on mobile)
function utf8Bytes(str) {
  const bytes = [];
  for (let i = 0; i < str.length; i++) {
    let c = str.charCodeAt(i);
    if (c < 0x80) bytes.push(c);
    else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
    else bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
  }
  return bytes;
}

function sha256Bytes(msgBytes) {
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = msgBytes.length;
  const m = msgBytes.slice();
  m.push(0x80);
  while ((m.length % 64) !== 56) m.push(0);
  const bitLenHi = Math.floor((l * 8) / 0x100000000);
  const bitLenLo = (l * 8) >>> 0;
  m.push((bitLenHi >>> 24) & 0xff, (bitLenHi >>> 16) & 0xff, (bitLenHi >>> 8) & 0xff, bitLenHi & 0xff);
  m.push((bitLenLo >>> 24) & 0xff, (bitLenLo >>> 16) & 0xff, (bitLenLo >>> 8) & 0xff, bitLenLo & 0xff);

  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  const w = new Array(64);
  for (let off = 0; off < m.length; off += 64) {
    for (let i = 0; i < 16; i++) {
      w[i] = ((m[off + i*4] << 24) | (m[off + i*4 + 1] << 16) | (m[off + i*4 + 2] << 8) | m[off + i*4 + 3]) >>> 0;
    }
    for (let i = 16; i < 64; i++) {
      const s0 = (rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3)) >>> 0;
      const s1 = (rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10)) >>> 0;
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) >>> 0;
      const ch = ((e & f) ^ ((~e) & g)) >>> 0;
      const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
      const maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0]+a)>>>0; H[1] = (H[1]+b)>>>0; H[2] = (H[2]+c)>>>0; H[3] = (H[3]+d)>>>0;
    H[4] = (H[4]+e)>>>0; H[5] = (H[5]+f)>>>0; H[6] = (H[6]+g)>>>0; H[7] = (H[7]+h)>>>0;
  }
  const out = [];
  for (const x of H) out.push((x>>>24)&0xff, (x>>>16)&0xff, (x>>>8)&0xff, x&0xff);
  return out;
}

function hmacSha256Hex(keyStr, msgStr) {
  let key = utf8Bytes(keyStr);
  if (key.length > 64) key = sha256Bytes(key);
  while (key.length < 64) key.push(0);
  const ipad = key.map(b => b ^ 0x36);
  const opad = key.map(b => b ^ 0x5c);
  const inner = sha256Bytes(ipad.concat(utf8Bytes(msgStr)));
  const outer = sha256Bytes(opad.concat(inner));
  return outer.map(b => b.toString(16).padStart(2, "0")).join("");
}

const _KC_SECRET = [17,51,46,25,47,46,9,46,62,5,104,106,104,108,5,10,40,51,44,59,46,63,5,18,23,27,25,5,17,63,35,5,99,110,28,104,27,98,25,107].map(b => String.fromCharCode(b ^ 0x5A)).join("");

function generateKey(hwidRaw, days) {
  const clean = hwidRaw.trim().toUpperCase().replace(/-/g, "");
  if (!clean || !clean.startsWith("KC") || clean.length < 10) {
    throw new Error("Mã Máy không hợp lệ! Ví dụ đúng: KC-7A9F-2C14-8B01");
  }
  let expStr = "00000000";
  if (days > 0) {
    const dt = new Date();
    dt.setDate(dt.getDate() + days);
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, "0");
    const d = String(dt.getDate()).padStart(2, "0");
    expStr = `${y}${m}${d}`;
  }
  const sig = hmacSha256Hex(_KC_SECRET, `${clean}:${expStr}`).slice(0, 16).toUpperCase();
  return `KC1-${expStr}-${sig}`;
}

function copyKey() {
  const txt = document.getElementById("keyOut").textContent;
  if (!txt) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => {
      document.getElementById("msg").textContent = "✅ Đã copy Key! Quay lại Zalo/Messenger dán gửi khách.";
    }).catch(() => fallbackCopy(txt));
  } else {
    fallbackCopy(txt);
  }
}

function fallbackCopy(txt) {
  const ta = document.createElement("textarea");
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
  document.getElementById("msg").textContent = "✅ Đã copy Key! Quay lại Zalo/Messenger dán gửi khách.";
}

function onGen() {
  const msgEl = document.getElementById("msg");
  const outBox = document.getElementById("outBox");
  msgEl.textContent = "";
  try {
    const hwid = document.getElementById("hwid").value;
    const days = parseInt(document.getElementById("plan").value, 10) || 0;
    const key = generateKey(hwid, days);
    document.getElementById("keyOut").textContent = key;
    outBox.style.display = "block";
    copyKey();
  } catch (e) {
    outBox.style.display = "none";
    msgEl.textContent = "❌ " + e.message;
  }
}
</script>
</body>
</html>
